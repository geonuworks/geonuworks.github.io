<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geonu Jo</title>

  <style>
    @font-face { font-family:'Poppins'; src:url('source/fonts/Poppins-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'Poppins'; src:url('source/fonts/Poppins-Medium.ttf') format('truetype'); font-weight:500; }
    @font-face { font-family:'Poppins'; src:url('source/fonts/Poppins-Bold.ttf') format('truetype'); font-weight:700; }

    html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    html, body {
      width:100%; min-height:100%;
      font-family:'Poppins', sans-serif;
      background:#0D0D11;
      color:#e8e8e8;
      overflow-x:hidden;
    }

    /* ── NAV ── */
    #global-nav {
      position:fixed; top:0; left:0; right:0; z-index:500;
      display:flex; align-items:baseline;
      padding:28px 48px 0;
      pointer-events:none;
    }
    #global-nav * { pointer-events:auto; }
    .nav-name  { font-size:0.95rem; font-weight:400; width:220px; flex-shrink:0; color:#e8e8e8; }
    .nav-title { font-size:0.95rem; font-weight:400; color:#e8e8e8; }
    .nav-year  { font-size:0.95rem; font-weight:400; flex:1; padding-left:40px; color:#e8e8e8; }
    .nav-links { display:flex; gap:40px; }
    .nav-links a { font-size:0.95rem; font-weight:400; color:#e8e8e8; text-decoration:none; }
    .nav-links a:hover { text-decoration:underline; text-underline-offset:3px; }

    /* ── LAYOUT wrapper (just a block container now) ── */
    #layout { display:block; }

    /* ── LEFT SIDEBAR: project index ── */
    #proj-sidebar {
      position:fixed;
      top:0; left:0;
      width:220px;
      height:100vh;
      padding:110px 0 48px 48px;
      display:flex;
      flex-direction:column;
      gap:6px;
      z-index:400;
      overflow:hidden;
    }

    .proj-nav-item {
      font-size:0.88rem;
      font-weight:400;
      color:#444448;
      cursor:pointer;
      line-height:1.5;
      transition:color 0.2s;
      white-space:nowrap;
      text-decoration:none;
    }
    .proj-nav-item strong { font-weight:700; }
    .proj-nav-item.active { color:#e8e8e8; text-decoration:underline; text-underline-offset:3px; }
    .proj-nav-item:hover  { color:#e8e8e8; }

    /* ── CENTER: images ── */
    #project-inner {
      margin-left:220px;
      margin-right:220px;
      padding:96px 0 120px;
      display:flex;
      flex-direction:column;
      opacity:0;
      transform:translateY(16px);
      animation:slideUp 0.45s ease 0.1s forwards;
    }
    @keyframes slideUp { to { opacity:1; transform:translateY(0); } }

    #project-inner picture { display:block; width:100%; }
    #project-inner picture img { width:100%; height:auto; display:block; vertical-align:top; }

    #vimeo-wrap { width:60%; margin:0 auto 8px; }

    /* ── RIGHT COLUMN: close button ── */
    #close-col {
      position:fixed;
      top:0; right:0;
      width:220px;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:400;
    }

    #btn-close {
      width:64px; height:64px;
      border-radius:50%;
      border:1.5px solid rgba(232,232,232,0.35);
      background:rgba(232,232,232,0.08);
      color:#e8e8e8;
      font-size:1.1rem;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.2s, border-color 0.2s, transform 0.2s;
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      opacity:0;
      animation:fadeIn 0.4s ease 0.3s forwards;
    }
    #btn-close:hover {
      background:rgba(232,232,232,0.18);
      border-color:rgba(232,232,232,0.7);
      transform:scale(1.06);
    }
    @keyframes fadeIn { to { opacity:1; } }

    /* ── 404 ── */
    #not-found {
      display:none; position:fixed; inset:0;
      align-items:center; justify-content:center;
      flex-direction:column; gap:16px;
      color:#e8e8e8; font-size:1rem;
    }
    #not-found a { color:#e8e8e8; text-decoration:underline; }

    /* ── MOBILE ── */
    @media (max-width: 768px), (max-width: 915px) and (orientation: landscape) {
      #global-nav {
        padding:16px 20px 0;
        flex-direction:column;
        gap:4px;
      }
      .nav-name { font-size:0.9rem; width:auto; }
      .nav-title, .nav-year { display:none; }
      .nav-links { gap:24px; margin-top:4px; }
      .nav-links a { font-size:0.9rem; }

      #proj-sidebar {
        width:100%;
        height:auto;
        padding:90px 20px 12px;
        flex-direction:row;
        overflow-x:auto;
        gap:20px;
        bottom:auto;
      }
      #proj-sidebar::-webkit-scrollbar { display:none; }
      .proj-nav-item { font-size:0.85rem; }

      #project-inner {
        margin-left:0;
        margin-right:0;
        padding:160px 20px 100px;
      }

      #vimeo-wrap { width:100%; }

      #close-col {
        top:auto;
        bottom:24px;
        right:20px;
        width:auto;
        height:auto;
      }
      #btn-close { width:52px; height:52px; font-size:1rem; }
    }
  </style>
</head>
<body>

<nav id="global-nav">
  <span class="nav-name">Geonu Jo</span>
  <span class="nav-title">Motions in Preferable Future</span>
  <span class="nav-year">2026</span>
  <div class="nav-links">
    <a href="index.html">Archive</a>
    <a href="index.html#sketchbook">Sketchbook</a>
    <a href="index.html#about">About</a>
  </div>
</nav>

<div id="layout">
  <aside id="proj-sidebar">
    <a class="proj-nav-item" href="p.html?key=bloom">Volvo <strong>BLOOM*</strong></a>
    <a class="proj-nav-item" href="p.html?key=stormgazer">HYUNDAI <strong>STORMGAZER</strong></a>
    <a class="proj-nav-item" href="p.html?key=play">Polestar <strong>PLAY!</strong></a>
    <a class="proj-nav-item" href="p.html?key=mazda">Mazda <strong>MELTING POINT</strong></a>
    <a class="proj-nav-item" href="p.html?key=side">Side Projects</a>
  </aside>

  <main id="project-inner"></main>

  <div id="close-col">
    <button id="btn-close" aria-label="Close">✕</button>
  </div>
</div>

<div id="not-found">
  <span>Project not found.</span>
  <a href="index.html">← Back to Archive</a>
</div>

<script>
const PROJECTS = {
  'bloom': {
    title:'Volvo BLOOM*',
    path:'source/projects/volvo-bloom/',
    images:Array.from({length:15},(_,i)=>String(i+1).padStart(2,'0')+'.jpg'),
    vimeo:'<div style="padding:68.52% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/1188949481?badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1&loop=1" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="BLOOM*"></iframe></div><script src="https://player.vimeo.com/api/player.js"><\/script>'
  },
  'stormgazer': {
    title:'HYUNDAI STORMGAZER',
    path:'source/projects/hyundai-stormgazer/',
    images:Array.from({length:13},(_,i)=>String(i+1).padStart(2,'0')+'.jpg')
  },
  'play': {
    title:'Polestar PLAY!',
    path:'source/projects/polestar-play/',
    images:Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0')+'.jpg')
  },
  'mazda': {
    title:'Mazda MELTING POINT',
    path:'source/projects/mazda-melting-point/',
    images:Array.from({length:7},(_,i)=>String(i+1).padStart(2,'0')+'.jpg')
  },
  'side': {
    title:'Side Projects',
    path:'source/projects/side-projects/',
    images:['01.jpg']
  }
};

function getKey() {
  const m = location.pathname.match(/\/p\/([^/?#]+)/);
  if (m) return m[1];
  return new URLSearchParams(location.search).get('key') || '';
}

function isMobile() {
  return window.innerWidth <= 768 || (window.innerWidth <= 915 && window.innerHeight < window.innerWidth);
}

/* 현재 key로 sidebar active 표시 */
function markActive(key) {
  document.querySelectorAll('.proj-nav-item').forEach(el => {
    const elKey = new URLSearchParams(new URL(el.href, location.href).search).get('key');
    el.classList.toggle('active', elKey === key);
  });
}

function render(key, scrollToPage) {
  const p = PROJECTS[key];
  if (!p) {
    document.getElementById('project-inner').style.display = 'none';
    document.getElementById('not-found').style.display = 'flex';
    document.title = 'Geonu Jo — Not Found';
    return;
  }

  document.title = `Geonu Jo — ${p.title}`;
  markActive(key);

  const inner = document.getElementById('project-inner');
  inner.innerHTML = '';

  if (p.vimeo) {
    const wrap = document.createElement('div');
    wrap.id = 'vimeo-wrap';
    if (isMobile()) wrap.style.width = '100%';
    wrap.innerHTML = p.vimeo;
    inner.appendChild(wrap);
    if (!document.querySelector('script[src*="vimeo.com/api/player"]')) {
      const s = document.createElement('script');
      s.src = 'https://player.vimeo.com/api/player.js';
      document.head.appendChild(s);
    }
  }

  p.images.forEach((f, idx) => {
    const picture = document.createElement('picture');
    picture.dataset.pageIndex = idx + 1;

    const source = document.createElement('source');
    source.srcset = p.path + 'webp/' + f.replace(/\.(jpg|jpeg)$/i, '.webp');
    source.type = 'image/webp';
    picture.appendChild(source);

    const img = document.createElement('img');
    img.src = p.path + 'jpg/' + f;
    img.alt = f;
    img.decoding = 'async';
    picture.appendChild(img);

    inner.appendChild(picture);
  });

  const targetPage = scrollToPage > 1 ? scrollToPage : null;
  if (targetPage) {
    requestAnimationFrame(() => {
      const el = inner.querySelector(`picture[data-page-index="${targetPage}"]`);
      if (!el) return;
      const img = el.querySelector('img');
      const doScroll = () => el.scrollIntoView({ behavior:'auto', block:'start' });
      if (img.complete && img.naturalWidth) doScroll();
      else img.onload = doScroll;
    });
  }
}

/* close */
document.getElementById('btn-close').addEventListener('click', () => {
  if (document.referrer && document.referrer.includes(location.hostname)) {
    history.back();
  } else {
    location.href = 'index.html';
  }
});

const key = getKey();
const startPage = parseInt(new URLSearchParams(location.search).get('page') || '1', 10);
render(key, startPage);
</script>
</body>
</html>
